{{/* Non-sensitive env: app env, the broker URL, and the in-cluster api URL for web. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "voyantra.fullname" . }}-config
  labels:
    {{- include "voyantra.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.appEnv | quote }}
  REDIS_URL: {{ include "voyantra.redisUrl" . | quote }}
  BACKEND_API_URL: {{ printf "http://%s-api:%d" (include "voyantra.fullname" .) (int .Values.api.port) | quote }}
