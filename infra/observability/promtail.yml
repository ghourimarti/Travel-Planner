# Promtail — tails Docker container logs (structured JSON on stdout) and ships them to
# Loki, so the app's logs are queryable in Grafana (Explore > Loki). Closes the audit gap:
# logs were emitted to stdout but never aggregated into a queryable store.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
