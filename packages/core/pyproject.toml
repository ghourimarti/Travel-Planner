[project]
name = "tp-core"
version = "0.1.0"
description = "Shared foundation (config, logging, errors) for the AI Travel Planner."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "structlog>=24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tp_core"]
