{{- $fullname := include "voyantra.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-worker
  labels:
    {{- include "voyantra.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "voyantra.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "voyantra.selectorLabels" (dict "root" . "component" "worker") | nindent 8 }}
    spec:
      # Time for Celery's warm shutdown to FINISH the run in hand (acks_late then acks it);
      # cut off sooner, the queue re-sends that run only after its 6-min visibility timeout.
      # Same reason as stop_grace_period in docker-compose.app.yml.
      terminationGracePeriodSeconds: 60
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.image.worker.repository }}:{{ .Values.image.worker.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ $fullname }}-config
            - secretRef:
                name: {{ $fullname }}-secret
          # No Service: the worker pulls jobs from Redis, nothing dials it.
          # Liveness via the celery ping so a wedged worker gets restarted.
          livenessProbe:
            exec:
              command: ["celery", "-A", "tp_worker.celery_app", "inspect", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 15
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
