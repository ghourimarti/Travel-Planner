[project]
name = "p3-ai-travel-planner"
version = "0.1.0"
description = "AI Travel Planner — production-grade Agentic RAG (uv monorepo)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "tenacity>=9.1.4",
    "tp-core",
    "tp-tools",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
tp-core = { workspace = true }
tp-tools = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "respx>=0.23.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["packages"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
