[project]
name = "tp-tools"
version = "0.1.0"
description = "Typed, resilient external tools (geocode/POI/weather/routing) for the AI Travel Planner."
requires-python = ">=3.13"
dependencies = [
    "tp-core",
    "httpx>=0.28",
    "tenacity>=9",
]

[tool.uv.sources]
tp-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tp_tools"]
