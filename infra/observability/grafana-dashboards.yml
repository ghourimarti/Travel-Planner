# Grafana dashboard provider: loads every *.json dashboard from the mounted folder.
apiVersion: 1
providers:
  - name: voyantra
    orgId: 1
    folder: Voyantra
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
