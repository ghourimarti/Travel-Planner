[project]
name = "tp-worker"
version = "0.1.0"
description = "Celery worker running the planner graph off the request thread (async dispatch)."
requires-python = ">=3.13"
dependencies = [
    "tp-core",
    "tp-agents",
    "tp-retrieval",
]

[tool.uv.sources]
tp-core = { workspace = true }
tp-agents = { workspace = true }
tp-retrieval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tp_worker"]
