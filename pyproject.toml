[project]
name = "p3-ai-travel-planner"
version = "0.1.0"
description = "AI Travel Planner — production-grade Agentic RAG (uv monorepo)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "tenacity>=9.1.4",
    "tp-core",
    "tp-tools",
    "tp-agents",
    "tp-api",
    "tp-eval",
    "tp-retrieval",
    "tp-worker",
]

[project.optional-dependencies]
# Production database drivers — installed in the container images (P6.1) via
# `uv sync --extra postgres`. Kept optional so local dev + tests stay on sqlite
# (aiosqlite) without pulling asyncpg/psycopg.
postgres = ["tp-core[postgres]", "tp-agents[postgres]"]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]
exclude = ["apps/web"]  # Next.js (Node) app — not a uv/Python workspace member

[tool.uv.sources]
tp-core = { workspace = true }
tp-tools = { workspace = true }
tp-agents = { workspace = true }
tp-api = { workspace = true }
tp-eval = { workspace = true }
tp-retrieval = { workspace = true }
tp-worker = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "respx>=0.23.1",
]
# Phase 5 hardening: supply-chain + SAST + secret/license audit tooling.
audit = [
    "pip-audit>=2.7",
    "bandit>=1.7",
    "detect-secrets>=1.5",
    "pip-licenses>=5",
]

[tool.bandit]
# SAST scans first-party source only; tests legitimately use `assert` (B101).
exclude_dirs = ["tests", ".venv", "apps/web", "demo"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["packages", "apps"]
markers = [
    "chaos: resilience/chaos tests — kill LLM/Redis/Qdrant, assert graceful degradation (Phase 5)",
]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "ragas.*", "langchain_openai.*", "datasets.*", "voyageai.*", "celery.*", "redis.*", "opentelemetry.instrumentation.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tp_worker.celery_app", "tp_worker.tasks"]
disallow_untyped_decorators = false
