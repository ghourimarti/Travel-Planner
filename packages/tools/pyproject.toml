[project]
name = "travel-tools"
version = "0.1.0"
description = "Typed, resilient tools the researcher agent calls (geocode, POI, weather, routing)."
requires-python = ">=3.13"
dependencies = [
    "travel-core",
    "httpx>=0.27",
    "tenacity>=8.2",
]

[tool.uv.sources]
travel-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tp_tools"]
