{{/* Sensitive env: the OpenAI key, the creds-bearing DATABASE_URL, web session secrets. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "voyantra.fullname" . }}-secret
  labels:
    {{- include "voyantra.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  DATABASE_URL: {{ include "voyantra.databaseUrl" . | quote }}
  SESSION_SECRET: {{ .Values.secrets.sessionSecret | quote }}
  DEV_LOGIN_PASSWORD: {{ .Values.secrets.devLoginPassword | quote }}
