{{/* IRSA-bound ServiceAccount (cloud only). The annotation lets pods — and the
     External Secrets store that references this SA — assume the P6.3 IAM role to
     read AWS Secrets Manager. Off for kind (uses the namespace default SA). */}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "voyantra.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ . | quote }}
  {{- end }}
{{- end }}
