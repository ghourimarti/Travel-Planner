[project]
name = "tp-core"
version = "0.1.0"
description = "Shared foundation (config, logging, errors) for the AI Travel Planner."
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.109.1",
    "groq>=1.4.0",
    "openai>=2.41.1",
    "pydantic>=2",
    "pydantic-settings>=2",
    "structlog>=24",
    "sqlalchemy[asyncio]>=2.0",
    "celery[redis]>=5.4",
    "aiosqlite>=0.20",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "prometheus-client>=0.20",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tp_core"]
