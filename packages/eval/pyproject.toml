[project]
name = "tp-eval"
version = "0.1.0"
description = "Evaluation harness (trajectory metrics + LLM-judge faithfulness) for the AI Travel Planner."
requires-python = ">=3.13"
dependencies = [
    "tp-core",
    "tp-agents",
    "tp-tools",
    "tp-retrieval",
    "pydantic>=2",
]

# RAGAS pulls in the whole langchain stack, so it's opt-in: `uv sync --extra judge`.
# Use it to cross-check faithfulness against a standard implementation. The default
# faithfulness/relevancy judge runs through our own gateway (judge.py).
[project.optional-dependencies]
ragas = ["ragas>=0.2", "datasets>=3", "langchain-openai>=0.2"]

[tool.uv.sources]
tp-core = { workspace = true }
tp-agents = { workspace = true }
tp-tools = { workspace = true }
tp-retrieval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tp_eval"]
