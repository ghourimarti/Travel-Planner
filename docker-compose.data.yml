# Layer 1 of 3 — DATA stores (stateful backing services).
#   data  : this file                      -> Postgres + Redis + Qdrant
#   app   : + docker-compose.app.yml        -> api + worker + web
#   obs   : + docker-compose.observability.yml -> Jaeger/Grafana/Prometheus/Flower/RedisInsight
# Drive it all through the Makefile: `make data` | `make app` | `make up` | `make urls`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tp}
      POSTGRES_DB: ${POSTGRES_DB:-tp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tp}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Vector DB for the POI corpus (RAG). A real server (Decision 2), not the embedded
  # file store — the embedded store can't be shared across the worker's prefork
  # processes. Seed it once with `make seed` (persists in the tp_qdrant volume).
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - tp_qdrant:/qdrant/storage

  # Self-hosted Overpass (OSM tag-accurate POIs: restaurants/shops/bars/beaches/etc.
  # that Wikipedia's fallback structurally can't provide — see tp_tools/pois.py).
  # Public Overpass mirrors WAF-block or hang from most networks, so this is the
  # only reliable source of real interest-filtered POIs. First start imports the
  # OVERPASS_PLANET_URL extract into the tp_overpass_db volume (Asia extract:
  # ~2-4h one-time import; subsequent starts reuse the built DB and start in
  # seconds). Optional — the app degrades to the Wikipedia fallback if unset/down.
  overpass:
    image: wiktorn/overpass-api
    environment:
      OVERPASS_META: "yes"
      OVERPASS_MODE: "init"
      # Geofabrik dropped .osm.bz2 for regional extracts (only .pbf now) — the
      # image only imports .bz2, so convert with the bundled osmium on download.
      OVERPASS_PLANET_URL: ${OVERPASS_PLANET_URL:-https://download.geofabrik.de/asia-latest.osm.pbf}
      OVERPASS_PLANET_PREPROCESS: >-
        mv /db/planet.osm.bz2 /db/planet.osm.pbf &&
        osmium cat -o /db/planet.osm.bz2 /db/planet.osm.pbf &&
        rm /db/planet.osm.pbf
      OVERPASS_RULES_LOAD: 10
    ports:
      - "${OVERPASS_PORT:-3015}:80"
    volumes:
      - tp_overpass_db:/db
    restart: unless-stopped

volumes:
  tp_pgdata:
  tp_qdrant:
  tp_overpass_db:
