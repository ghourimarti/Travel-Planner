# Layer 1 of 3 — DATA stores (stateful backing services).
#   data  : this file                      -> Postgres + Redis + Qdrant
#   app   : + docker-compose.app.yml        -> api + worker + web
#   obs   : + docker-compose.observability.yml -> Jaeger/Grafana/Prometheus/Flower/RedisInsight
# Drive it all through the Makefile: `make data` | `make app` | `make up` | `make urls`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tp}
      POSTGRES_DB: ${POSTGRES_DB:-tp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tp}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Vector DB for the POI corpus (RAG). A real server, not the embedded
  # file store — the embedded store can't be shared across the worker's prefork
  # processes. Seed it once with `make seed` (persists in the tp_qdrant volume).
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - tp_qdrant:/qdrant/storage

  # Self-hosted Overpass = the GLOBAL, interest-aware POI tier (OpenStreetMap). The
  # curated Qdrant corpus grounds hero cities; Overpass covers every city in the imported
  # region with real OSM categories (temple/museum/beach/restaurant/…), so interest
  # filtering genuinely works worldwide-within-region. The Wikipedia fallback is only for
  # regions/cities neither source covers.
  #
  # FIRST BOOT imports OVERPASS_PLANET_URL, then serves it (~2-4h import into ~40-60GB DB).
  # It is idle until import finishes; watch with `docker compose logs -f overpass`.
  #
  # We import from a LOCALLY PRE-DOWNLOADED file (OSM_DATA_DIR bind mount + a file:// URL),
  # NOT the container's own downloader. The image's curl has no resume/retry, so an ~11GB
  # direct download stalls forever on any connection drop. Downloading on the host with
  # `curl -C - --retry` (resumable) and importing the local file is reliable. To cover a
  # different region: download that Geofabrik extract into OSM_DATA_DIR, point
  # OVERPASS_PLANET_FILE at it, and recreate the tp_overpass_db volume.
  overpass:
    image: wiktorn/overpass-api
    environment:
      OVERPASS_META: "yes"
      OVERPASS_MODE: "init"
      # Import the pre-downloaded local extract (mounted read-only at /data). The image
      # treats file:// specially — curl returns HTTP 000, which its entrypoint accepts.
      OVERPASS_PLANET_URL: file:///data/${OVERPASS_PLANET_FILE:-us-latest.osm.pbf}
      # Geofabrik dropped .osm.bz2 for regional extracts (only .pbf now) — but the image
      # only imports .bz2, so convert with the bundled osmium on download. (Do NOT remove:
      # without this the import silently fails on the modern .pbf-only extracts.)
      OVERPASS_PLANET_PREPROCESS: >-
        mv /db/planet.osm.bz2 /db/planet.osm.pbf &&
        osmium cat -o /db/planet.osm.bz2 /db/planet.osm.pbf &&
        rm /db/planet.osm.pbf
      OVERPASS_RULES_LOAD: 10      # parallelism for the area/rules load step
    ports:
      - "${OVERPASS_PORT:-3015}:80"
    volumes:
      - tp_overpass_db:/db
      # Host dir holding the pre-downloaded .osm.pbf extract(s), read-only.
      - ${OSM_DATA_DIR:-./osm-data}:/data:ro
    restart: unless-stopped

volumes:
  tp_pgdata:
  tp_qdrant:
  tp_overpass_db:
