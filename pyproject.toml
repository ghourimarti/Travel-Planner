[project]
name = "p3-ai-travel-planner"
version = "0.1.0"
description = "Production-grade agentic AI travel planner (portfolio -> production transformation)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "travel-core",
]

# --- uv workspace -----------------------------------------------------------
# The repo root is a non-packaged workspace root (no [build-system] = not built
# as a package). Members are added per transformation step so `uv sync` never
# breaks on an incomplete member.
[tool.uv.workspace]
members = ["packages/core"]

[tool.uv.sources]
travel-core = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
]

# --- tooling ----------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
# Legacy + auxiliary trees are intentionally excluded from lint. `demo/` is the
# strangler-fig legacy app (retired at Step 13); `old/` and `Prompts/` are not code.
extend-exclude = ["old", "demo", "Prompts", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# Our workspace packages — keeps first-party imports in their own group.
known-first-party = ["tp_core", "tp_agent", "tp_tools", "tp_eval"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages"]
markers = [
    "integration: requires running services or network access",
]
