{{/* Cloud secret delivery. ESO pulls a single JSON secret from AWS Secrets
     Manager and materializes <fullname>-secret — the SAME name the deployments
     mount via envFrom — so api/worker/web are agnostic to where secrets come from.
     The remote JSON must hold the keys the app expects (OPENAI_API_KEY,
     DATABASE_URL, SESSION_SECRET, DEV_LOGIN_PASSWORD). Off for kind/local. */}}
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "voyantra.fullname" . }}-secret
  labels:
    {{- include "voyantra.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: {{ include "voyantra.fullname" . }}-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required "externalSecrets.remoteKey is required when externalSecrets.enabled=true" .Values.externalSecrets.remoteKey }}
{{- end }}
