# Layer 2 of 3 — the APP (api + worker + web). Overlays the DATA layer
# (docker-compose.data.yml: db + redis + qdrant). Run via `make app` (or `make up`
# for app + observability). Credentials/ports come from .env (defaults shown).
# DATABASE_URL/REDIS_URL/QDRANT_URL use in-network service names (db/redis/qdrant),
# so changing the *host* ports in .env never breaks container-to-container traffic.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tp}:${POSTGRES_PASSWORD:-tp}@db:5432/${POSTGRES_DB:-tp}
      REDIS_URL: redis://redis:6379/0
      # Crash-recovery latency: how long a task may sit unacked after a worker dies.
      # Must exceed the longest real task runtime (see tp_core/celery.py).
      CELERY_VISIBILITY_TIMEOUT: ${CELERY_VISIBILITY_TIMEOUT:-360}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      QDRANT_URL: http://qdrant:6333
      # Serving chain: local engine first, hosted venues behind it. SERVING_CHAIN is
      # EMPTY by default, which keeps the legacy per-tier order -- so this whole block
      # is inert until you opt in. The engine URLs use in-network service names for the
      # same reason DATABASE_URL does: the gpu tier runs in THIS compose project, so
      # `sglang`/`vllm` resolve over the shared default network without host ports.
      SERVING_CHAIN: ${SERVING_CHAIN:-}
      SERVING_ENGINE: ${SERVING_ENGINE:-sglang}
      CHAIN_CHEAP: ${CHAIN_CHEAP:-}
      CHAIN_MID: ${CHAIN_MID:-}
      CHAIN_FRONTIER: ${CHAIN_FRONTIER:-}
      VLLM_URL: ${VLLM_URL:-}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}
      SGLANG_URL: ${SGLANG_URL:-}
      SGLANG_MODEL: ${SGLANG_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}
      # A dead leg is retried on EVERY request without a breaker, turning one down
      # venue into latency on 100% of traffic.
      CIRCUIT_FAILURE_THRESHOLD: ${CIRCUIT_FAILURE_THRESHOLD:-3}
      CIRCUIT_COOLDOWN_SECONDS: ${CIRCUIT_COOLDOWN_SECONDS:-30}
      MAX_COST_USD: ${MAX_COST_USD:-0.30}
      # Cost controls. LLM_ENABLED is a FLOOR: shipped false, no runtime Redis value
      # can turn generation back on. DAILY_SPEND_LIMIT_USD=0 disables the breaker,
      # which is today's behaviour - a config addition must never be a behaviour change.
      LLM_ENABLED: ${LLM_ENABLED:-true}
      DAILY_SPEND_LIMIT_USD: ${DAILY_SPEND_LIMIT_USD:-0}
      SPEND_SOFT_ALERT_RATIO: ${SPEND_SOFT_ALERT_RATIO:-0.8}
      # Abuse defence. Every limit ships at 0 (off) except the existing per-minute one.
      # TRUSTED_PROXY_HOPS=0 means X-Forwarded-For is IGNORED: a header you trust but
      # nobody sets is a header anyone can forge.
      RATE_LIMIT_PER_DAY: ${RATE_LIMIT_PER_DAY:-0}
      RATE_LIMIT_IP_PER_MIN: ${RATE_LIMIT_IP_PER_MIN:-0}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      # Retrieval depth (was hardcoded 20/8 in tp_retrieval).
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-20}
      RERANK_TOP_K: ${RERANK_TOP_K:-8}
      # Cache invalidation by version key; bumping one orphans the old entries and
      # lets their TTL reap them, instead of a FLUSHDB that discards everything.
      PROMPT_VERSION: ${PROMPT_VERSION:-v1}
      CORPUS_VERSION: ${CORPUS_VERSION:-v1}
      INDEX_VERSION: ${INDEX_VERSION:-v1}
      # Infra breakers, separate from the serving-venue breaker.
      POSTGRES_CIRCUIT_FAILURE_THRESHOLD: ${POSTGRES_CIRCUIT_FAILURE_THRESHOLD:-3}
      POSTGRES_CIRCUIT_COOLDOWN_SECONDS: ${POSTGRES_CIRCUIT_COOLDOWN_SECONDS:-30}
      REDIS_CIRCUIT_FAILURE_THRESHOLD: ${REDIS_CIRCUIT_FAILURE_THRESHOLD:-3}
      REDIS_CIRCUIT_COOLDOWN_SECONDS: ${REDIS_CIRCUIT_COOLDOWN_SECONDS:-30}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-60}
      # Telemetry export (best-effort) — destinations live in the observability tier.
      # Harmless when that tier isn't running; spans/generations are just dropped.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: http://langfuse-web:3000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tp}:${POSTGRES_PASSWORD:-tp}@db:5432/${POSTGRES_DB:-tp}
      REDIS_URL: redis://redis:6379/0
      # Crash-recovery latency: how long a task may sit unacked after a worker dies.
      # Must exceed the longest real task runtime (see tp_core/celery.py).
      CELERY_VISIBILITY_TIMEOUT: ${CELERY_VISIBILITY_TIMEOUT:-360}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      # Ground in the curated POI corpus via a real Qdrant server,
      # not the embedded file store (which can't be shared across the worker's
      # prefork processes). Keep ingest+query on the same embedder (see `make seed`).
      QDRANT_URL: http://qdrant:6333
      # Global, interest-aware POI tier: self-hosted Overpass (OpenStreetMap). Hardcoded
      # to the in-network service (same pattern as QDRANT_URL above — the empty .env var
      # is for native dev only). The `overpass` service imports for hours on first boot,
      # so this is intentionally NOT a hard dependency — the worker runs immediately and
      # OSM lights up once import finishes; until then find_pois uses the Wikipedia fallback.
      OVERPASS_URL: http://overpass:80/api/interpreter
      # Serving chain: local engine first, hosted venues behind it. SERVING_CHAIN is
      # EMPTY by default, which keeps the legacy per-tier order -- so this whole block
      # is inert until you opt in. The engine URLs use in-network service names for the
      # same reason DATABASE_URL does: the gpu tier runs in THIS compose project, so
      # `sglang`/`vllm` resolve over the shared default network without host ports.
      SERVING_CHAIN: ${SERVING_CHAIN:-}
      SERVING_ENGINE: ${SERVING_ENGINE:-sglang}
      CHAIN_CHEAP: ${CHAIN_CHEAP:-}
      CHAIN_MID: ${CHAIN_MID:-}
      CHAIN_FRONTIER: ${CHAIN_FRONTIER:-}
      VLLM_URL: ${VLLM_URL:-}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}
      SGLANG_URL: ${SGLANG_URL:-}
      SGLANG_MODEL: ${SGLANG_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}
      # A dead leg is retried on EVERY request without a breaker, turning one down
      # venue into latency on 100% of traffic.
      CIRCUIT_FAILURE_THRESHOLD: ${CIRCUIT_FAILURE_THRESHOLD:-3}
      CIRCUIT_COOLDOWN_SECONDS: ${CIRCUIT_COOLDOWN_SECONDS:-30}
      MAX_COST_USD: ${MAX_COST_USD:-0.30}
      # Cost controls. LLM_ENABLED is a FLOOR: shipped false, no runtime Redis value
      # can turn generation back on. DAILY_SPEND_LIMIT_USD=0 disables the breaker,
      # which is today's behaviour - a config addition must never be a behaviour change.
      LLM_ENABLED: ${LLM_ENABLED:-true}
      DAILY_SPEND_LIMIT_USD: ${DAILY_SPEND_LIMIT_USD:-0}
      SPEND_SOFT_ALERT_RATIO: ${SPEND_SOFT_ALERT_RATIO:-0.8}
      # Abuse defence. Every limit ships at 0 (off) except the existing per-minute one.
      # TRUSTED_PROXY_HOPS=0 means X-Forwarded-For is IGNORED: a header you trust but
      # nobody sets is a header anyone can forge.
      RATE_LIMIT_PER_DAY: ${RATE_LIMIT_PER_DAY:-0}
      RATE_LIMIT_IP_PER_MIN: ${RATE_LIMIT_IP_PER_MIN:-0}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      # Retrieval depth (was hardcoded 20/8 in tp_retrieval).
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-20}
      RERANK_TOP_K: ${RERANK_TOP_K:-8}
      # Cache invalidation by version key; bumping one orphans the old entries and
      # lets their TTL reap them, instead of a FLUSHDB that discards everything.
      PROMPT_VERSION: ${PROMPT_VERSION:-v1}
      CORPUS_VERSION: ${CORPUS_VERSION:-v1}
      INDEX_VERSION: ${INDEX_VERSION:-v1}
      # Infra breakers, separate from the serving-venue breaker.
      POSTGRES_CIRCUIT_FAILURE_THRESHOLD: ${POSTGRES_CIRCUIT_FAILURE_THRESHOLD:-3}
      POSTGRES_CIRCUIT_COOLDOWN_SECONDS: ${POSTGRES_CIRCUIT_COOLDOWN_SECONDS:-30}
      REDIS_CIRCUIT_FAILURE_THRESHOLD: ${REDIS_CIRCUIT_FAILURE_THRESHOLD:-3}
      REDIS_CIRCUIT_COOLDOWN_SECONDS: ${REDIS_CIRCUIT_COOLDOWN_SECONDS:-30}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9200}
      # Celery's prefork pool runs tasks in CHILD processes, whose prometheus_client
      # counters live in their own memory and never reach the parent that serves
      # /metrics. Setting this makes children write mmap files the parent aggregates
      # at scrape time. Without it, every run metric reads 0 forever.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-multiproc
      # Telemetry export (best-effort) — destinations live in the observability tier.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: http://langfuse-web:3000
    # Backing store for PROMETHEUS_MULTIPROC_DIR above. A tmpfs guarantees the directory
    # exists BEFORE the process starts (prometheus_client creates mmap files at import
    # time) and that it is empty on every start, so counters never carry over from a
    # previous container life.
    tmpfs:
      - /tmp/prometheus-multiproc:mode=1777
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      # Raise Node's HTTP header cap (default ~16KB). Every app on `localhost` shares one
      # cookie jar, so a dev browser piles up cookies from Grafana/Langfuse/etc. and the
      # combined Cookie header on requests to this app exceeds the limit -> HTTP 431.
      # 64KB comfortably absorbs a polluted localhost so the page loads without 431.
      NODE_OPTIONS: ${WEB_NODE_OPTIONS:---max-http-header-size=65536}
      # Server-side BFF target: reach the api over the compose network, not localhost.
      BACKEND_API_URL: http://api:8000
      DEV_LOGIN_PASSWORD: ${DEV_LOGIN_PASSWORD:-voyantra}
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-session-secret-change-me-32b}
      # Auth0 SSO (optional — app uses its native sign-up when these are unset)
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:-}
      AUTH0_SECRET: ${AUTH0_SECRET:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      # Whether the BACKEND actually verifies tokens. The web tier needs this to decide
      # whether to ask Auth0 for an API access token at all: requesting an `audience`
      # triggers Auth0's consent screen, and Auth0 CANNOT skip consent for an app on
      # localhost. Without these two vars the web tier asked for a token on every
      # backend call while AUTH_ENABLED=false meant nothing ever checked it — one
      # "Authorize App" click per trip, for nothing.
      # Same rule as tp_core Settings.auth_required: explicit flag, else app_env.
      AUTH_ENABLED: ${AUTH_ENABLED:-}
      APP_ENV: ${APP_ENV:-}
      # "Continue with Google" on the native page (optional — button hides when unset)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Browser-visible base URL — builds the Google redirect (and any Auth0 callback)
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3006}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
