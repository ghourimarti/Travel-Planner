[project]
name = "tp-retrieval"
version = "0.1.0"
description = "RAG grounding: embeddings + Qdrant vector store + retrieve/rerank for the AI Travel Planner."
requires-python = ">=3.13"
dependencies = [
    "tp-core",
    "tp-tools",
    "openai>=2",
    "qdrant-client>=1.12",
    "voyageai>=0.3",
    "pydantic>=2",
]

[tool.uv.sources]
tp-core = { workspace = true }
tp-tools = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tp_retrieval"]
