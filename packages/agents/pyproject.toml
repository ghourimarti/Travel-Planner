[project]
name = "tp-agents"
version = "0.1.0"
description = "LangGraph planning agents (single-agent slice in S4; multi-agent in S7) for the AI Travel Planner."
requires-python = ">=3.13"
dependencies = [
    "tp-core",
    "tp-tools",
    "pydantic>=2",
    "langgraph>=0.2",
]

[tool.uv.sources]
tp-core = { workspace = true }
tp-tools = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tp_agents"]
