# Alertmanager — routes the Prometheus SLO/cost rules in alerts.yaml. This local config
# uses a no-op default receiver so the pipeline is COMPLETE and testable end-to-end; wire a
# real receiver (Slack / PagerDuty / webhook) per environment in the receivers block below.
route:
  receiver: default
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    # Per environment, add e.g.:
    #   slack_configs:
    #     - api_url: <SLACK_WEBHOOK_URL>
    #       channel: "#alerts"
    #   pagerduty_configs:
    #     - routing_key: <PAGERDUTY_ROUTING_KEY>
