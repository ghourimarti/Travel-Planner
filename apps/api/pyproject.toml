[project]
name = "tp-api"
version = "0.1.0"
description = "FastAPI surface for the AI Travel Planner (POST /plan)."
requires-python = ">=3.13"
dependencies = [
    "tp-core",
    "tp-agents",
    "tp-retrieval",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.uv.sources]
tp-core = { workspace = true }
tp-agents = { workspace = true }
tp-retrieval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tp_api"]
