# Grafana auto-provisioned datasource: the local Prometheus above.
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    # Stable UID so the provisioned dashboard can reference this datasource
    # deterministically instead of Grafana's random auto-assigned UID.
    uid: prometheus
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: loki
    editable: true
